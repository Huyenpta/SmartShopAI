
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>SmartShopAI - Review Reports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
            padding: 30px;
            color: #243247;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #263c82;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px #00000012;
            overflow-x: auto;
        }

        button {
            background: #3458d4;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            margin-bottom: 20px;
        }

            button:hover {
                background: #203c9f;
            }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e9f0;
            text-align: center;
        }

        th {
            background: #eef2ff;
        }

        td:nth-child(2) {
            text-align: left;
        }

        .positive {
            color: #16834b;
        }

        .neutral {
            color: #b77900;
        }

        .negative {
            color: #d13b3b;
        }

        #status {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SmartShopAI - Review Analytics</h1>
        <p>Product Review & Sentiment Statistics</p>

        <div class="card">
            <button onclick="loadReports()">
                Refresh Report
            </button>

            <p id="status">Loading...</p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Reviews</th>
                        <th>Avg Rating</th>
                        <th>Positive</th>
                        <th>Neutral</th>
                        <th>Negative</th>
                        <th>Avg Score</th>
                    </tr>
                </thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadReports() {
            const status = document.getElementById("status");
            const tbody = document.getElementById("reportBody");

            status.textContent = "Loading...";
            tbody.innerHTML = "";

            try {
                const response = await fetch("/api/reports/reviews");

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                for (const p of data) {
                    const tr = document.createElement("tr");

                    const values = [
                        p.productId,
                        p.productName,
                        p.totalReviews,
                        Number(p.averageRating).toFixed(2),
                        p.positive,
                        p.neutral,
                        p.negative,
                        Number(p.averageSentimentScore).toFixed(2)
                    ];

                    values.forEach((value, index) => {
                        const td = document.createElement("td");
                        td.textContent = value;

                        if (index === 4) td.className = "positive";
                        if (index === 5) td.className = "neutral";
                        if (index === 6) td.className = "negative";

                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                }

                status.textContent =
                    "Loaded " + data.length + " products.";

            } catch (error) {
                status.textContent =
                    "Cannot load report: " + error.message;
            }
        }

        loadReports();
    </script>
</body>
</html>
